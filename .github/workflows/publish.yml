name: Publish to PyPI

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install ea-compiler and build tools
        run: pip install ea-compiler build
      - name: Build kernels (generic x86-64)
        run: |
          EA=$(python -c "import ea._compiler; print(ea._compiler._ea_binary())")
          $EA chacha20.ea --lib --opt-level=3 --target=x86-64
          $EA chacha20_search.ea --lib --opt-level=3 --target=x86-64
          $EA chacha20_search_v2.ea --lib --opt-level=3 --target=x86-64
          cp chacha20.so chacha20_search.so chacha20_search_v2.so src/eachacha/lib/
      - name: Build wheel
        run: python -m build --wheel
      - name: Fix platform tag
        run: |
          cd dist
          for f in *-py3-none-any.whl; do
            mv "$f" "${f/py3-none-any/py3-none-manylinux_2_17_x86_64.manylinux2014_x86_64}"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-linux
          path: dist/*.whl

  publish:
    needs: [build]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

name: Build & Publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish to PyPI (false = build only)"
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

env:
  EA_VERSION: "v1.10.0"
  EA_REPO: "petlukk/eacompute"

jobs:
  build-linux-x86_64:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Download ea binary
        run: |
          curl -fsSL "https://github.com/$EA_REPO/releases/download/$EA_VERSION/ea-linux-x86_64.tar.gz" -o ea.tar.gz
          tar xzf ea.tar.gz
          mv ea-linux-x86_64/ea ./ea
          chmod +x ea

      - name: Compile kernels (generic x86-64)
        run: |
          for k in chacha20 chacha20_search chacha20_search_v2; do
            ./ea ${k}.ea --lib --opt-level=3 --target=x86-64
          done
          cp chacha20.so chacha20_search.so chacha20_search_v2.so src/eachacha/lib/

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build and retag wheel
        run: |
          pip install build wheel
          python -m build --wheel
          python -m wheel tags \
            --platform-tag manylinux_2_17_x86_64 \
            --remove dist/eachacha-*.whl

      - uses: actions/upload-artifact@v4
        with:
          name: wheel-linux-x86_64
          path: dist/*.whl

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download ea binary
        shell: pwsh
        run: |
          Invoke-WebRequest `
            "https://github.com/$env:EA_REPO/releases/download/$env:EA_VERSION/ea-windows-x86_64.zip" `
            -OutFile ea.zip
          Expand-Archive ea.zip -DestinationPath .
          Move-Item ea-windows-x86_64\ea.exe .\ea.exe

      - name: Compile kernels (generic x86-64)
        shell: bash
        run: |
          for k in chacha20 chacha20_search chacha20_search_v2; do
            ./ea.exe ${k}.ea --lib --opt-level=3 --target=x86-64
          done
          mkdir -p src/eachacha/lib
          cp chacha20.dll chacha20_search.dll chacha20_search_v2.dll src/eachacha/lib/

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build and retag wheel
        shell: pwsh
        run: |
          pip install build wheel
          python -m build --wheel
          python -m wheel tags --platform-tag win_amd64 --remove (Get-ChildItem dist\eachacha-*.whl).FullName

      - uses: actions/upload-artifact@v4
        with:
          name: wheel-windows
          path: dist/*.whl

  publish:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish)
    needs: [build-linux-x86_64, build-windows]
    runs-on: ubuntu-24.04
    environment: pypi
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist/
          merge-multiple: true

      - name: List wheels
        run: ls -la dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
